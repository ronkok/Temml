<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="initial-scale=1">
	<title>Investigate</title>
   <link rel="stylesheet" type="text/css" href="../site/assets/Temml-Latin-Modern.css">
   <script src="./temml.js"></script>
   <style>
      body {
      margin: 0;
      padding: 0;
      font-size: 24px;
      }

      .math {
          font-size: 24px;
      }

      #input {
          margin: 0;
          font-size: 100%;
          width: 100%;
          box-sizing: border-box;
      }
      .tml-eqn::before {
    counter-increment: tmlEqnNo;
    content: "(" counter(tmlEqnNo) ")";
}
   </style>
</head>
<body>

<p>
  <math>
    <mover>
      <mi>a</mi>
      <mo stretchy="false" class="wbk-acc" style="math-depth:0;">^</mo>
    </mover>
    <mover>
      <mi>a</mi>
      <mo stretchy="false" class="wbk-acc" style="math-depth:0;">ˆ</mo>
    </mover>
  </math>
</p>

<p>
<math>
  <mover>
    <mi>a</mi>
    <mo>^</mo>
  </mover>
  <mover>
    <mi>a</mi>
    <mo>ˆ</mo>
  </mover>
  <math>
    <mover>
      <mrow>
        <mi>a</mi>
        <mi>a</mi>
        <mi>a</mi>
      </mrow>
      <mo stretchy="true" style="math-depth:0;">^</mo>
    </mover>
  </math>
  <mover>
    <mrow>
      <mi>a</mi>
      <mi>a</mi>
      <mi>a</mi>
    </mrow>
    <mo stretchy="true" style="math-depth:0;">ˆ</mo>
  </mover>
</math>
</p>

<p><math>
  <mrow>
    <mrow>
      <mi mathvariant="normal">A</mi>
      <mspace></mspace>
    </mrow>
    <mrow>
      <mspace width="0.2778em"></mspace>
      <mover accent="false">
        <mo stretchy="true" lspace="0" rspace="0">→</mo>
        <mover>
          <mrow>
            <mspace width="0.4286em"></mspace>
            <mrow>
              <mi mathvariant="normal">i</mi>
              <mspace></mspace>
            </mrow>
            <mspace width="0.4286em"></mspace>
          </mrow>
          <mspace width="4.0000em"></mspace>
        </mover>
      </mover>
      <mspace width="0.2778em"></mspace>
    </mrow>
    <mrow>
      <mi mathvariant="normal">B</mi>
      <mspace></mspace>
    </mrow>
  </mrow>
</math></p>

<p>
<math>
  <mrow>
    <menclose notation="updiagonalstrike" style="color:#ff0000;">
      <mrow>
        <mi style="color:black;">B</mi>
      </mrow>
      <mrow class="tml-cancel upstrike"></mrow>
    </menclose>
  </mrow>
</math>
</p>

<p>
  <math>
    <msqrt>
      <msup>
        <mi>x</mi>
        <mi>c</mi>
      </msup>
    </msqrt>
    <msqrt>
      <msup style="math-shift: compact">
        <mi>x</mi>
        <mi>c</mi>
      </msup>
    </msqrt>
  </math>
</p>

</body>
</html>
